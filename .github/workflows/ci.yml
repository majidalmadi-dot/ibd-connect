name: CI gate (parse + jsdom smoke)

# Runs the same gate as deploy.sh on every push / PR that touches an app file,
# so a broken build is caught in GitHub even when it wasn't caught locally.
on:
  push:
    paths:
      - 'index.html'
      - 'EoE/index.html'
      - 'Qawam/index.html'
      - 'shared/**'
      - 'build.mjs'
      - 'ci/**'
      - '**/sw.js'
      - 'vercel.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'EoE/index.html'
      - 'Qawam/index.html'
      - 'shared/**'
      - 'build.mjs'
      - 'ci/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Check shared modules are built (de-triplication)
        run: node build.mjs --check
      - name: Install gate dependencies
        working-directory: ci
        run: npm ci || npm install
      - name: Backup crypto + recovery code tests
        run: node --test ci/crypto.test.mjs
      - name: Dependency audit (gate dependencies)
        working-directory: ci
        run: npm audit --audit-level=high
      - name: Run parse-check + jsdom smoke (all apps)
        run: node ci/verify.mjs
