<!doctype html>

<style>
:root{
  --bg:#FBF6F0; --card:#FFFFFF; --line:#EFE3D6; --txt:#2B2019; --muted:#8A7A6C;
  --accent:#EA8A4E; --accent-strong:#D2703A; --leaf:#3FA972; --sky:#4F9AD6;
  --good:#3FA972; --warn:#E0A23D; --danger:#D4553C; --disk:#7C5CFF;
  --radius:16px; --radius-sm:11px; --tap:44px; --fs:1;
}
html[data-theme="dark"]{
  --bg:#171310; --card:#221B15; --line:#33281F; --txt:#F3EAE0; --muted:#A2917F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  font-size:calc(15px * var(--fs));line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Georgia,"Noto Naskh Arabic",serif;margin:0}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brandwrap{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px}
.brandmark{width:30px;height:30px;flex:none}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--txt);
  border-radius:999px;min-height:var(--tap);padding:6px 13px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:active{transform:scale(.97)}
#screens{flex:1;overflow-y:auto;padding:14px 14px 96px;-webkit-overflow-scrolling:touch}
.screen{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(120,80,40,.04)}
.card h2{font-size:19px}.card h3{font-size:16px;font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-weight:800}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer;font-size:15px;min-height:var(--tap);width:100%}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-strong)}
.btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn-soft{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-strong)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.leaf.on{background:var(--leaf);border-color:var(--leaf)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800}
.pill.a{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-strong)}
.pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.d{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.scale{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.scale button{flex:1;min-width:36px;min-height:44px;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:11px;cursor:pointer;font-weight:800;font-size:15px}
.scale button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:13px;padding:12px 14px;cursor:pointer;margin-bottom:8px;min-height:var(--tap)}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.opt .em{font-size:24px;flex:none;width:30px;text-align:center}
label.fld{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--txt);font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;
  background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabbar.hidden{display:none}
.hidden{display:none!important}
.tab{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab.on{color:var(--accent)}
.fab{position:fixed;bottom:78px;inset-inline-end:calc(50% - 260px + 16px);z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(210,112,58,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}

.sheet-bd{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;animation:up .28s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.alert{border-radius:14px;padding:14px;border:1px solid;margin-bottom:12px}
.alert.red{background:color-mix(in srgb,var(--danger) 10%,transparent);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.alert.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.disc{font-size:11.5px;color:var(--muted);line-height:1.5;margin:14px 2px 2px}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;font-weight:800;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.list-i{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-i:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
a.link{color:var(--accent-strong);font-weight:700;text-decoration:none}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--card)),var(--card));border:1px solid var(--line)}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:1px 6px}
@media print{.tabbar,.fab,.topbar .iconbtn,.noprint{display:none!important}#screens{padding:0}.card{break-inside:avoid}}
</style>
</head>

  <div id="screens"></div>
  <button class="fab noprint hidden" id="fab" onclick="openQuickLog()">＋</button>
  <nav class="tabbar hidden" id="tabbar"></nav>
</div>

const KEY='barem_v1';
function blank(){return{
  lang:null, onboarded:false,
  children:[], activeChildId:null,
  logs:[], meds:[], checkins:[],
  prefs:{theme:'light', textScale:1, remind:true},
  seenSafety:false
};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));
  if(!v)return blank();const s=Object.assign(blank(),v);
  s.prefs=Object.assign(blank().prefs,v.prefs||{});return s;}catch(e){return blank();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const rid=()=>Math.random().toString(36).slice(2,9);
const nowISO=()=>new Date().toISOString();
const dayKey=d=>(d?new Date(d):new Date()).toISOString().slice(0,10);
function activeChild(){return S.children.find(c=>c.id===S.activeChildId)||S.children[0]||null;}
function childLogs(cid){return S.logs.filter(l=>l.childId===cid);}
/* age helpers */
function ageMonths(c){if(!c||!c.birth)return null;const b=new Date(c.birth+'-01');const n=new Date();
  return (n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());}
function ageLabel(c){const m=ageMonths(c);if(m==null)return '';
  if(m<24)return isAr()?`${m} شهرًا`:`${m} mo`;const y=Math.floor(m/12);return isAr()?`${y} سنوات`:`${y} yr`;}
function isInfant(c){const m=ageMonths(c);return m!=null&&m<18;}
function isTeen(c){const m=ageMonths(c);return m!=null&&m>=144;} /* 12y+ */

/* ============ UI HELPERS ============ */
function card(html,cls){return `<div class="card ${cls||''}">${html}</div>`;}
function topbar(title,sub){return `<div style="margin:2px 0 14px"><h2>${title}</h2>${sub?`<div class="muted sm">${sub}</div>`:''}</div>`;}
function backbar(title){return `<div class="row" style="margin-bottom:12px"><button class="iconbtn" onclick="goBack()">${isAr()?'→':'←'} ${t('back')}</button><b style="font-size:16px">${title}</b></div>`;}
function segMonths(){return isAr()?'شهر':'mo';}
function avatarFor(c){const colors=['#EA8A4E','#4F9AD6','#3FA972','#B57BD6','#E0A23D'];
  const i=Math.abs((c.id||'x').charCodeAt(0))%colors.length;const ini=(c.name||'👶').slice(0,1).toUpperCase();
  return `<span class="avatar" style="background:${colors[i]}">${c.name?ini:'👶'}</span>`;}
function toast(msg){let e=document.createElement('div');e.textContent=msg;
  e.style.cssText='position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:800;z-index:60;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)';
  document.body.appendChild(e);setTimeout(()=>e.remove(),1500);}
let SHEET=null;
function openSheet(html){closeSheet();const bd=document.createElement('div');bd.className='sheet-bd';
  bd.onclick=e=>{if(e.target===bd)closeSheet();};
  bd.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;document.body.appendChild(bd);SHEET=bd;}
function closeSheet(){if(SHEET){SHEET.remove();SHEET=null;}}

/* generic single-select group used inside sheets */
function optGroup(id,items){/* items:[{v,em,label}] */
  return `<div data-grp="${id}">`+items.map(o=>`<button class="opt" data-v="${o.v}" onclick="pickOpt('${id}','${o.v}')">${o.em?`<span class="em">${o.em}</span>`:''}<span>${o.label}</span></button>`).join('')+`</div>`;}
function pickOpt(id,v){const g=document.querySelector(`[data-grp="${id}"]`);if(!g)return;
  [...g.children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));g.dataset.val=v;}
function grpVal(id){const g=document.querySelector(`[data-grp="${id}"]`);return g&&g.dataset.val!=null?g.dataset.val:null;}
function chipsRow(id,items){/* multi toggle */return `<div class="row wrap" data-chips="${id}">`+items.map(o=>`<button class="chip leaf" data-v="${o.v}" onclick="this.classList.toggle('on')">${o.label}</button>`).join('')+`</div>`;}
function chipVals(id){const g=document.querySelector(`[data-chips="${id}"]`);return g?[...g.querySelectorAll('.on')].map(b=>b.dataset.v):[];}
function scaleSel(id,n){let h=`<div class="scale" data-scale="${id}">`;for(let i=0;i<=n;i++)h+=`<button data-v="${i}" onclick="pickScale('${id}',${i})">${i}</button>`;return h+'</div>';}
function pickScale(id,v){const w=document.querySelector(`[data-scale="${id}"]`);[...w.children].forEach(b=>b.classList.remove('on'));w.querySelector(`[data-v="${v}"]`).classList.add('on');w.dataset.val=v;}
function scaleVal(id){const w=document.querySelector(`[data-scale="${id}"]`);return w&&w.dataset.val!=null?+w.dataset.val:null;}
function faces(id){const F=[['😀',0,{en:'No hurt',ar:'لا ألم'}],['🙂',2,{en:'Hurts a little',ar:'قليل'}],['😐',4,{en:'Hurts a bit more',ar:'أكثر قليلًا'}],['😣',6,{en:'Hurts even more',ar:'أكثر'}],['😢',8,{en:'Hurts a lot',ar:'كثير'}],['😭',10,{en:'Hurts worst',ar:'الأشد'}]];
  return `<div class="row wrap" data-scale="${id}" style="gap:6px">`+F.map(([e,v,l])=>`<button class="opt" style="flex-direction:column;flex:1;min-width:64px;gap:2px" data-v="${v}" onclick="pickScale('${id}',${v})"><span style="font-size:28px">${e}</span><span class="xs">${L(l)}</span></button>`).join('')+`</div>`;}

/* ============ ROUTER ============ */
const ROUTES={};let CURRENT='today',CURRENT_OPTS={},STACK=[];
function route(n,fn){ROUTES[n]=fn;}
function go(n,opts){opts=opts||{};if(!opts.replace&&CURRENT&&CURRENT!==n)STACK.push(CURRENT);CURRENT=n;CURRENT_OPTS=opts;closeSheet();render();window.scrollTo(0,0);}
function goBack(){if(STACK.length){CURRENT=STACK.pop();CURRENT_OPTS={};closeSheet();render();}else navTab('today');}
const MAIN_TABS=['today','diary','library','report','more'];
function navTab(n){STACK=[];CURRENT=n;CURRENT_OPTS={};closeSheet();render();document.getElementById('screens').scrollTo(0,0);}
function render(){applyDir();
  if(!S.onboarded){renderOnboard();return;}
  const host=document.getElementById('screens');host.innerHTML='';
  const node=document.createElement('div');node.className='screen';
  (ROUTES[CURRENT]||ROUTES.today)(node,CURRENT_OPTS);host.appendChild(node);
  const isMain=MAIN_TABS.includes(CURRENT);
  const tb=document.getElementById('tabbar');tb.classList.toggle('hidden',!isMain);
  document.getElementById('fab').classList.toggle('hidden',!(isMain&&S.children.length));
  const items=[['today','home'],['diary','pencil'],['library','book'],['report','chart'],['more','dots']];
  tb.innerHTML=items.map(([k,i])=>`<button class="tab ${CURRENT===k?'on':''}" onclick="navTab('${k}')">${ic(i,21)}<span>${t(k)}</span></button>`).join('');}

/* ============ ONBOARDING ============ */
function renderOnboard(){const host=document.getElementById('screens');host.innerHTML='';
  document.getElementById('tabbar').classList.add('hidden');document.getElementById('fab').classList.add('hidden');
  const n=document.createElement('div');n.className='screen';
  if(S.lang==null){
    n.innerHTML=card(`<div style="text-align:center;padding:14px 4px">
      <div style="width:64px;height:64px;margin:0 auto 10px">${brandSVG().replace('width="30" height="30"','width="64" height="64"')}</div>
      <h2>Baraʿem · براعم</h2><div class="muted" style="margin:6px 0 20px">Pediatric tummy companion<br>رفيق صحة أمعاء الطفل</div>
      <div style="font-weight:800;margin-bottom:10px">${'Choose your language · اختر لغتك'}</div>
      <button class="btn btn-primary" style="margin-bottom:10px" onclick="setLang('en')">English</button>
      <button class="btn btn-ghost" onclick="setLang('ar')">العربية</button>
      <div class="xs muted" style="margin-top:16px">Private on your device · no account needed</div></div>`);
  }else{
    n.innerHTML=card(`<div style="text-align:center"><div style="width:56px;height:56px;margin:6px auto">${brandSVG().replace('width="30" height="30"','width="56" height="56"')}</div>
      <h2>${t('welcome')}</h2><p class="muted" style="margin:8px 4px 14px">${t('welcomeSub')}</p></div>`)
    + childForm(null,true)
    + `<p class="disc">${t('disc')}</p>`;
  }
  host.appendChild(n);
}
function setLang(l){S.lang=l;save();render();}

function conditionPicker(sel){sel=sel||[];
  const items=CONDITIONS.filter(c=>c.pick).map(c=>({v:c.key,label:L(c.name)}));
  return chipsRow('kidcond',items).replace('data-chips="kidcond"',`data-chips="kidcond"`)
    .replace(/class="chip leaf" data-v="([^"]+)"/g,(m,v)=>`class="chip leaf ${sel.includes(v)?'on':''}" data-v="${v}"`);}
function childForm(c,isFirst){c=c||{};
  return card(`
    <label class="fld">${t('childName')}</label><input id="cf_name" value="${c.name||''}" placeholder="${isAr()?'مثال: سارة':'e.g. Sara'}">
    <label class="fld">${t('birth')}</label><input id="cf_birth" type="month" value="${c.birth||''}" max="${dayKey().slice(0,7)}">
    <label class="fld">${t('sex')}</label>
    <div class="seg" data-grp="cf_sex"><button data-v="f" onclick="pickOpt('cf_sex','f')" class="${c.sex==='f'?'on':''}">${t('girl')}</button><button data-v="m" onclick="pickOpt('cf_sex','m')" class="${c.sex==='m'?'on':''}">${t('boy')}</button></div>
    <label class="fld">${t('conditions')}</label>${conditionPicker(c.conditions)}
    <button class="btn btn-primary" style="margin-top:16px" onclick="saveChild('${c.id||''}',${!!isFirst})">${isFirst?t('getStarted'):t('save')}</button>
  `);}
function saveChild(id,first){
  const name=(document.getElementById('cf_name').value||'').trim();
  const birth=document.getElementById('cf_birth').value||'';
  const sex=grpVal('cf_sex')||'';const conditions=chipVals('kidcond');
  if(!birth){toast(isAr()?'أدخل شهر الميلاد':'Enter birth month');return;}
  if(id){const c=S.children.find(x=>x.id===id);if(c){c.name=name;c.birth=birth;c.sex=sex;c.conditions=conditions;}}
  else{const c={id:rid(),name,birth,sex,conditions};S.children.push(c);S.activeChildId=c.id;}
  if(first){S.onboarded=true;}save();
  if(first){go('today',{replace:true});} else goBack();
}

 triggers:{en:'Excitement or stress, infections, missed sleep, skipped meals/fasting, some foods; a personal or family history of migraine.',ar:'الإثارة أو التوتر، العدوى، قلة النوم، تفويت الوجبات/الصيام، بعض الأطعمة؛ تاريخ شخصي أو عائلي للصداع النصفي.'},
 mgmt:{en:'Between attacks: regular meals and sleep, avoiding triggers; specialists sometimes discuss preventives. During an attack: rest, hydration and anti-sickness care, sometimes in hospital. All medicines via a specialist.',ar:'بين النوبات: وجبات ونوم منتظم وتجنّب المحفّزات؛ يناقش المختص أحيانًا الوقاية. أثناء النوبة: راحة وترطيب وعلاج للغثيان، أحيانًا بالمستشفى. كل الأدوية عبر المختص.'},
 redflags:{en:'Green (bilious) vomit, blood in vomit, severe dehydration, severe or one-sided tummy pain, or a first severe episode.',ar:'قيء أخضر (صفراوي)، دم في القيء، جفاف شديد، ألم بطن شديد أو أحادي الجانب، أو أول نوبة شديدة.'}},
{key:'ibd',cat:'chronic',pick:true,name:{en:'IBD (Crohn’s & colitis)',ar:'التهاب الأمعاء (كرون والتقرحي)'},
 whatis:{en:'Long-term immune inflammation of the gut. Crohn’s can affect anywhere from mouth to bottom; ulcerative colitis affects the large-bowel lining. It is not caused by anything a parent did.',ar:'التهاب مناعي مزمن للأمعاء. قد يصيب كرون أي مكان من الفم إلى الشرج؛ ويصيب التهاب القولون التقرحي بطانة القولون. لا ينتج عن أي خطأ من الوالدين.'},
 signs:{en:'Persistent diarrhoea (often bloody in colitis), tummy pain, weight loss, poor growth or delayed puberty, tiredness, mouth ulcers, fevers, sometimes joint/skin/eye symptoms.',ar:'إسهال مستمر (غالبًا مدمّى في التقرحي)، ألم بطن، فقدان وزن، ضعف نمو أو تأخر بلوغ، إرهاق، تقرّحات فم، حمّى، وأحيانًا أعراض مفاصل/جلد/عين.'},
 triggers:{en:'Genetic tendency plus gut-bacteria and environment. Flares can follow illness, missed medicine or (in some) certain painkillers.',ar:'استعداد وراثي مع بكتيريا الأمعاء والبيئة. قد تلي الانتكاسات مرضًا أو نسيان الدواء أو (لدى البعض) بعض المسكّنات.'},
 mgmt:{en:'Long-term treatment to reach and keep remission and protect growth — families hear about aminosalicylates, short steroid courses, immune-modulators, exclusive liquid nutrition (often for Crohn’s), and biologics. Adherence, nutrition, bone health and vaccines matter.',ar:'علاج طويل الأمد لبلوغ الهدأة والحفاظ عليها وحماية النمو — يسمع الأهل عن الأمينوساليسيلات، وكورسات ستيرويد قصيرة، ومعدّلات مناعة، والتغذية السائلة الحصرية (غالبًا لكرون)، والبيولوجيّات. الالتزام والتغذية وصحة العظام واللقاحات مهمة.'},
 redflags:{en:'Heavy rectal bleeding, severe tummy pain or swelling, high fever, persistent vomiting, dehydration, or rapid weight loss.',ar:'نزيف شرجي غزير، ألم أو انتفاخ بطن شديد، حمّى عالية، قيء مستمر، جفاف، أو فقدان وزن سريع.'}},
{key:'coeliac',cat:'chronic',pick:true,name:{en:'Coeliac disease',ar:'الداء الزلاقي'},
 whatis:{en:'An immune reaction to gluten (wheat, barley, rye) that damages the small-bowel lining in genetically prone children. It is lifelong and managed by diet.',ar:'تفاعل مناعي مع الغلوتين (القمح والشعير والجاودار) يُتلف بطانة الأمعاء الدقيقة لدى الأطفال المهيّئين وراثيًا. حالة مدى الحياة تُدار بالحمية.'},
 signs:{en:'Very variable: poor growth, diarrhoea or constipation, tummy pain and bloating, low iron, tiredness, mouth ulcers, delayed puberty — many children have few or no symptoms and are found by screening.',ar:'متغيّرة جدًا: ضعف نمو، إسهال أو إمساك، ألم بطن وانتفاخ، نقص حديد، إرهاق، تقرّحات فم، تأخر بلوغ — كثيرون بلا أعراض تقريبًا ويُكتشفون بالفحص.'},
 triggers:{en:'Gluten in a genetically susceptible child. Higher risk with a first-degree relative, type-1 diabetes, or certain genetic conditions.',ar:'الغلوتين لدى طفل مهيّأ وراثيًا. الخطر أعلى مع قريب من الدرجة الأولى أو السكري النوع الأول أو بعض الحالات الوراثية.'},
 mgmt:{en:'A strict lifelong gluten-free diet heals the gut and resolves symptoms — with label-reading, avoiding cross-contact, a dietitian, and monitoring. Testing should be done BEFORE removing gluten so results stay accurate.',ar:'حمية خالية من الغلوتين صارمة مدى الحياة تشفي الأمعاء وتزيل الأعراض — مع قراءة الملصقات وتجنّب التلوّث المتبادل وأخصائي تغذية والمتابعة. يجب الفحص قبل إيقاف الغلوتين ليبقى دقيقًا.'},
 redflags:{en:'Do not remove gluten before testing. See the team for poor growth, ongoing symptoms, or nutrient deficiencies.',ar:'لا توقف الغلوتين قبل الفحص. راجع الفريق عند ضعف النمو أو استمرار الأعراض أو نقص المغذيات.'}},
{key:'eoe',cat:'chronic',pick:true,name:{en:'Eosinophilic esophagitis (EoE)',ar:'التهاب المريء اليوزيني'},
 whatis:{en:'A chronic, allergy-driven inflammation of the food pipe where immune cells build up in response to foods, making it swollen and stiff over time.',ar:'التهاب مزمن للمريء بدافع الحساسية، تتراكم فيه خلايا مناعية استجابةً للأطعمة فيصبح متورّمًا ومتيبّسًا مع الوقت.'},
 signs:{en:'Babies/toddlers: feeding trouble, food refusal, slow eating, vomiting, poor growth. Older children: trouble swallowing, food sticking, chest/tummy pain, drinking lots with meals, avoiding textures.',ar:'الرضّع/الدارجون: صعوبة تغذية، رفض طعام، أكل بطيء، قيء، ضعف نمو. الأكبر سنًا: صعوبة بلع، انحشار طعام، ألم صدر/بطن، شرب كثير مع الأكل، تجنّب القوام.'},
 triggers:{en:'Food allergens (often milk, wheat, egg, soy). Strong link with eczema, asthma and hay fever.',ar:'مُحسِّسات غذائية (غالبًا الحليب والقمح والبيض والصويا). ارتباط قوي بالإكزيما والربو وحمى القش.'},
 mgmt:{en:'Specialist-led “3 Ds”: Drugs (swallowed steroids, acid medicines), Diet (removing trigger foods, or an amino-acid formula) and Dilation of a narrowed pipe in older patients, with endoscopy to monitor.',ar:'"العناصر الثلاثة" بإشراف مختص: الأدوية (ستيرويد يُبلع، أدوية الحموضة)، والحمية (إزالة الأطعمة المحفّزة أو حليب الأحماض الأمينية)، وتوسيع المريء الضيّق لدى الأكبر، مع تنظير للمتابعة.'},
 redflags:{en:'Food stuck in the throat or chest that will not pass is an emergency. Also persistent vomiting, weight loss, feeding refusal or new swallowing trouble.',ar:'انحشار طعام في الحلق أو الصدر لا يمرّ حالة طارئة. وكذلك قيء مستمر، فقدان وزن، رفض تغذية، أو صعوبة بلع جديدة.'}},
{key:'allergy',cat:'chronic',pick:true,name:{en:'Food allergy & CMPA',ar:'حساسية الطعام وحساسية حليب البقر'},
 whatis:{en:'An immune reaction to a food. Fast (IgE) reactions come within minutes and can be severe; delayed (non-IgE) reactions cause gut symptoms over hours–days. Cow’s-milk allergy is the commonest in babies.',ar:'تفاعل مناعي مع طعام. التفاعلات السريعة (IgE) تحدث خلال دقائق وقد تكون شديدة؛ والمتأخرة (غير IgE) تسبب أعراضًا معوية خلال ساعات–أيام. حساسية حليب البقر أكثرها لدى الرضّع.'},
 signs:{en:'Fast: hives, swelling, vomiting, wheeze, rarely anaphylaxis after eating. Delayed: reflux, vomiting, diarrhoea or constipation, blood/mucus in a well-looking baby’s stool, eczema flares, poor growth.',ar:'سريعة: شرى، تورّم، قيء، أزيز، ونادرًا تأق بعد الأكل. متأخرة: ارتجاع، قيء، إسهال أو إمساك، دم/مخاط في براز رضيع يبدو بخير، اشتداد إكزيما، ضعف نمو.'},
 triggers:{en:'Common foods: milk, egg, peanut, tree nuts, wheat, soy, fish, shellfish, sesame. A family history of allergy raises risk.',ar:'أطعمة شائعة: الحليب، البيض، الفول السوداني، المكسرات، القمح، الصويا، السمك، المحار، السمسم. التاريخ العائلي يزيد الخطر.'},
 mgmt:{en:'Avoiding the food under guidance; for milk allergy a special hydrolyzed/amino-acid formula, or a dairy-free trial for breastfeeding mothers. Many children outgrow milk/egg allergy; structured reintroduction (a “milk/egg ladder”) is done WITH the team, never self-started for fast allergies.',ar:'تجنّب الطعام بإرشاد؛ ولحساسية الحليب حليب متحلّل/أحماض أمينية خاص، أو تجربة خالية من الألبان للأم المرضعة. كثيرون يتخطّون حساسية الحليب/البيض؛ وتُجرى إعادة الإدخال المتدرّجة ("سُلّم الحليب/البيض") مع الفريق، ولا تُبدأ ذاتيًا في الحساسية السريعة.'},
 redflags:{en:'Trouble breathing, swelling of lips/tongue/throat, widespread hives, or floppiness/paleness after a food = possible anaphylaxis — call emergency services. Also blood in stool or poor weight gain.',ar:'صعوبة تنفّس، تورّم الشفتين/اللسان/الحلق، شرى منتشر، أو ارتخاء/شحوب بعد طعام = تأق محتمل — اتصل بالطوارئ. وكذلك دم في البراز أو ضعف نمو.'}},
{key:'infstool',cat:'infant',pick:false,name:{en:'Normal baby stools',ar:'براز الرضيع الطبيعي'},
 whatis:{en:'Newborns pass dark sticky meconium for 1–2 days, then green, then yellow. Breastfed babies often have soft, seedy, mustard-yellow stools; formula stools are firmer and tan. Frequency varies hugely and can be normal.',ar:'يخرج المولود العِقْي الأسود اللاصق ١–٢ يومًا، ثم أخضر، ثم أصفر. براز الرضيع الطبيعي غالبًا ليّن مصفرّ محبّب؛ وبراز الحليب الصناعي أكثر تماسكًا وبنيًّا. يتفاوت التكرار كثيرًا وقد يكون طبيعيًا.'},
 signs:{en:'Wide normal range of colour and frequency — from after every feed to once every few days while soft.',ar:'مدى طبيعي واسع للّون والتكرار — من بعد كل رضعة إلى مرة كل بضعة أيام ما دام ليّنًا.'},
 triggers:{en:'Diet (breast vs formula, starting solids) naturally changes colour and firmness.',ar:'يغيّر النظام الغذائي (طبيعي/صناعي، بدء الطعام الصلب) اللون والقوام طبيعيًا.'},
 mgmt:{en:'Mostly reassurance and tracking what is usual for your baby, so changes are easy to spot.',ar:'غالبًا طمأنة ومتابعة المعتاد لطفلك حتى يسهل ملاحظة التغيّرات.'},
 redflags:{en:'Red (blood), black (after meconium), or pale/white “chalky” stools are not normal and need a doctor.',ar:'البراز الأحمر (دم) أو الأسود (بعد العِقْي) أو الشاحب/الأبيض "الطباشيري" غير طبيعي ويستدعي الطبيب.'}},
{key:'weaning',cat:'infant',pick:false,name:{en:'Weaning & solids',ar:'الفطام والطعام الصلب'},
 whatis:{en:'Starting solid foods, usually around 6 months (not before 4 months) when your baby can hold their head steady, sit with support and shows interest in food.',ar:'بدء الأطعمة الصلبة، غالبًا نحو ٦ أشهر (وليس قبل ٤)، عندما يثبّت الطفل رأسه ويجلس بمساعدة ويُبدي اهتمامًا بالطعام.'},
 signs:{en:'Readiness cues: good head control, sitting with support, bringing things to the mouth, watching you eat.',ar:'علامات الجاهزية: تحكّم جيّد بالرأس، الجلوس بمساعدة، إدخال الأشياء للفم، مراقبتك تأكل.'},
 triggers:{en:'Start smooth then lumpy textures and finger foods; offer iron-rich foods; keep milk feeds alongside.',ar:'ابدأ بقوام ناعم ثم مكتّل وأطعمة تُمسك باليد؛ قدّم أطعمة غنية بالحديد؛ واستمر برضعات الحليب.'},
 mgmt:{en:'Common allergens (well-cooked egg, smooth peanut in safe forms) can be introduced from ~6 months one at a time — delaying them does not prevent allergy. Log any reaction.',ar:'يمكن إدخال المُحسِّسات الشائعة (بيض مطهو جيدًا، فول سوداني ناعم بشكل آمن) من ~٦ أشهر واحدًا تلو الآخر — تأخيرها لا يمنع الحساسية. سجّل أي تفاعل.'},
 redflags:{en:'Choking (different from gagging), an allergic reaction, ongoing refusal or poor weight gain — speak to your team.',ar:'الاختناق (يختلف عن الغثيان)، تفاعل تحسّسي، رفض مستمر أو ضعف نمو — راجع فريقك.'}},
{key:'growth',cat:'infant',pick:false,name:{en:'Weight gain & growth',ar:'زيادة الوزن والنمو'},
 whatis:{en:'Growth is followed over time on charts rather than by a single weight. “Faltering growth” means weight or weight-for-length is tracking below expected or crossing down over weeks.',ar:'يُتابع النمو عبر الزمن على المخططات لا بوزن واحد. "تعثّر النمو" يعني أن الوزن أو الوزن مقابل الطول أدنى من المتوقع أو يعبر لأسفل خلال أسابيع.'},
 signs:{en:'Slow weight gain, clothes fitting for a long time, feeding difficulty or refusal, low energy.',ar:'زيادة وزن بطيئة، بقاء الملابس مناسبة طويلًا، صعوبة أو رفض تغذية، قلة طاقة.'},
 triggers:{en:'Most often not enough intake; sometimes poor absorption or higher needs from an illness.',ar:'غالبًا قلة المدخول؛ أحيانًا سوء امتصاص أو زيادة الحاجة بسبب مرض.'},
 mgmt:{en:'A feeding assessment, boosting calories and nutrients, treating any cause, and dietitian support — always interpreted on growth charts by your team.',ar:'تقييم التغذية، وزيادة السعرات والمغذيات، وعلاج أي سبب، ودعم أخصائي التغذية — ويُفسَّر دائمًا على مخططات النمو عبر فريقك.'},
 redflags:{en:'Weight crossing down two major chart lines, feeding refusal, vomiting/diarrhoea, or developmental concerns.',ar:'عبور الوزن خطّين رئيسيّين لأسفل، رفض تغذية، قيء/إسهال، أو مخاوف تطوّرية.'}}
];
function condsFor(cat){return CONDITIONS.filter(c=>c.cat===cat);}

route('today',(n)=>{
  const c=activeChild();if(!c){n.innerHTML=emptyState();return;}
  const tl=childLogs(c.id).filter(l=>l.t.slice(0,10)===dayKey());
  const hour=new Date().getHours();const greet=hour<12?{en:'Good morning',ar:'صباح الخير'}:hour<18?{en:'Good afternoon',ar:'مساء الخير'}:{en:'Good evening',ar:'مساء الخير'};
  const dueMeds=S.meds.filter(m=>m.childId===c.id);
  n.innerHTML=
    childBar(c)+
    card(`<div class="row between"><div><div class="muted sm">${L(greet)}</div><h2 style="margin-top:2px">${c.name?c.name:(isAr()?'طفلك':'Your little one')}</h2><div class="muted sm">${ageLabel(c)} ${c.conditions&&c.conditions.length?'· '+c.conditions.map(k=>L((CONDITIONS.find(x=>x.key===k)||{}).name)).filter(Boolean).slice(0,2).join('، '):''}</div></div><div style="text-align:center"><div style="font-size:30px;font-weight:800;color:var(--accent)">${tl.length}</div><div class="xs muted">${t('entriesToday')}</div></div></div>`,'hero')+
    card(`<h3 style="margin-bottom:10px">${t('addToday')}</h3><div class="grid2">${quickBtns(c)}</div>`)+
    (dueMeds.length?card(`<h3 style="margin-bottom:8px">${isAr()?'أدوية مسجّلة':'Saved medicines'}</h3>`+dueMeds.map(m=>`<div class="row between" style="padding:6px 0"><span>💊 ${m.name}${m.dose?` · <span class="muted sm">${m.dose}</span>`:''}</span><button class="chip on" onclick="quickMedTaken('${m.id}')">${t('taken')} ✓</button></div>`).join('')):'')+
    card(`<div class="row between" style="margin-bottom:10px"><b>${t('tools')}</b><a class="link" onclick="go('tools')">${isAr()?'الكل':'All'} →</a></div><div class="grid2"><button class="btn btn-soft" style="display:flex;flex-direction:column;gap:4px;padding:13px 6px" onclick="go('gchart')"><span style="font-size:22px">📈</span><span class="sm">${t('growthCharts')}</span></button><button class="btn btn-soft" style="display:flex;flex-direction:column;gap:4px;padding:13px 6px" onclick="go('milestones')"><span style="font-size:22px">⭐</span><span class="sm">${t('milestones')}</span></button></div>`)+
    card(`<div class="row between"><b>${t('recent')}</b><a class="link" onclick="navTab('diary')">${isAr()?'الكل':'All'} →</a></div>`+recentList(c,4))+
    safetyCard(true)+
    `<p class="disc">${t('disc')}</p>`;
});
function emptyState(){return card(`<div style="text-align:center;padding:20px 6px">
  <div style="font-size:40px">👶</div><h3 style="margin:8px 0">${t('noChild')}</h3>
  <button class="btn btn-primary" style="margin-top:10px" onclick="go('editChild')">${t('addChild')}</button></div>`);}
function childBar(c){if(S.children.length<=1)return '';
  return `<div class="row wrap" style="margin-bottom:12px;gap:8px">`+S.children.map(k=>`<button class="chip ${k.id===c.id?'on':''}" onclick="setActive('${k.id}')">${k.name||'👶'} · ${ageLabel(k)}</button>`).join('')+`</div>`;}
function setActive(id){S.activeChildId=id;save();render();}
function quickBtns(c){const inf=isInfant(c);
  const b=[['stool','💩',t('logstool')],[inf?'feed':'sym','🍼',inf?t('logfeed'):t('logsym')],['vomit','🤢',t('logvomit')],['growth','📏',t('loggrowth')]];
  if(!inf)b[1]=['sym','🩹',t('logsym')];
  return b.map(([k,e,l])=>`<button class="btn btn-soft" style="display:flex;flex-direction:column;gap:4px;padding:14px 6px" onclick="logSheet('${k}')"><span style="font-size:24px">${e}</span><span style="font-size:13px">${l}</span></button>`).join('');}
function recentList(c,lim){const ls=childLogs(c.id).slice().reverse().slice(0,lim||6);
  if(!ls.length)return `<div class="muted sm" style="padding:10px 0">${t('none')}</div>`;
  return ls.map(l=>{const m=logMeta(l);return `<div class="list-i"><span class="dot" style="background:${m.color}"></span><div style="flex:1"><div style="font-weight:700">${m.title}</div><div class="muted xs">${m.sub}</div></div><div class="muted xs">${timeAgo(l.t)}</div></div>`;}).join('');}
function timeAgo(iso){const d=(Date.now()-new Date(iso))/6e4;if(d<60)return isAr()?`قبل ${Math.max(1,Math.round(d))} د`:`${Math.max(1,Math.round(d))}m ago`;
  const h=d/60;if(h<24)return isAr()?`قبل ${Math.round(h)} س`:`${Math.round(h)}h ago`;const dd=Math.round(h/24);return isAr()?`قبل ${dd} ي`:`${dd}d ago`;}

/* ============ DIARY ============ */
route('diary',(n)=>{const c=activeChild();if(!c){n.innerHTML=emptyState();return;}
  n.innerHTML=childBar(c)+topbar(t('diary'),c.name?`${c.name} · ${ageLabel(c)}`:ageLabel(c))+
  card(`<h3 style="margin-bottom:10px">${t('quicklog')}</h3><div class="grid2">${quickBtns(c)}<button class="btn btn-soft" style="display:flex;flex-direction:column;gap:4px;padding:14px 6px" onclick="logSheet('med')"><span style="font-size:24px">💊</span><span style="font-size:13px">${t('logmed')}</span></button><button class="btn btn-soft" style="display:flex;flex-direction:column;gap:4px;padding:14px 6px" onclick="go('checkin')"><span style="font-size:24px">📝</span><span style="font-size:13px">${t('checkin')}</span></button></div>`)+
  card(`<b>${t('recent')}</b>`+recentList(c,40))+
  `<p class="disc">${t('discShort')}</p>`;
});

/* ============ LOG SHEETS ============ */
function logSheet(kind){const c=activeChild();if(!c)return;const inf=isInfant(c);
  let body='',title='';
  if(kind==='stool'){title=inf?t('infantStool'):t('bristol');
    if(inf){body=`<label class="fld">${t('consistency')}</label>${optGroup('st_c',[{v:'watery',em:'💧',label:isAr()?'مائي':'Watery'},{v:'soft',em:'🟡',label:isAr()?'ليّن':'Soft'},{v:'formed',em:'🟤',label:isAr()?'متماسك':'Formed'},{v:'hard',em:'🟫',label:isAr()?'صلب':'Hard'}])}
      <label class="fld">${t('color')}</label>${optGroup('st_col',[{v:'yellow',em:'🟡',label:isAr()?'أصفر':'Yellow'},{v:'green',em:'🟢',label:isAr()?'أخضر':'Green'},{v:'brown',em:'🟤',label:isAr()?'بنّي':'Brown'},{v:'black',em:'⚫',label:isAr()?'أسود':'Black'},{v:'red',em:'🔴',label:isAr()?'أحمر':'Red-tinged'},{v:'pale',em:'⚪',label:isAr()?'شاحب/أبيض':'Pale/white'}])}`;

/* live timer used by sleep & nursing */
const TIMERS={};
function timerUI(key){return `<button class="btn btn-soft" id="tb_${key}" onclick="toggleTimer('${key}')">${t('start')} ⏱</button><div id="tt_${key}" class="muted sm" style="text-align:center;margin-top:6px"></div>`;}
function toggleTimer(key){const btn=document.getElementById('tb_'+key),out=document.getElementById('tt_'+key);
  if(TIMERS[key]){clearInterval(TIMERS[key].iv);const mins=Math.max(1,Math.round((Date.now()-TIMERS[key].start)/6e4));
    const inp=document.getElementById(key==='sleep'?'sl_min':'nu_min');if(inp)inp.value=mins;TIMERS[key]=null;btn.textContent=t('start')+' ⏱';btn.classList.remove('on');out.textContent=mins+' '+t('minutes');return;}
  TIMERS[key]={start:Date.now(),iv:setInterval(()=>{const s=Math.round((Date.now()-TIMERS[key].start)/1000);out.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},1000)};
  btn.textContent=t('stop')+' ⏱';btn.classList.add('on');}
function saveSleep(){const m=+val('sl_min');if(!m){toast(t('pickNum'));return;}addLog({type:'sleep',mins:m,note:val('sl_note')});afterSave();}
function saveNurse(){const m=+val('nu_min');addLog({type:'nurse',side:grpVal('nu_s'),mins:m||null});afterSave();}
function savePump(){const ml=+val('pu_ml');if(!ml){toast(t('pickNum'));return;}addLog({type:'pump',ml,side:grpVal('pu_s'),note:val('pu_note')});afterSave();}
function saveTeeth(){addLog({type:'teeth',signs:chipVals('te_s'),note:val('te_note')});afterSave();}
function yesno(id){return `<div class="seg" data-grp="${id}"><button data-v="no" class="on" onclick="pickOpt('${id}','no')">${t('no')}</button><button data-v="yes" onclick="pickOpt('${id}','yes')">${t('yes')}</button></div>`;}
function noteField(id){return `<label class="fld">${t('note')}</label><textarea id="${id}" rows="2" placeholder="${isAr()?'أي تفاصيل لمشاركتها مع الطبيب':'anything to share with your doctor'}"></textarea>`;}
function saveBtn(fn){return `<button class="btn btn-primary" style="margin-top:16px" onclick="${fn}">${t('save')}</button>`;}
function medPicker(){const meds=[['PEG / laxative',{en:'Laxative (PEG)',ar:'مليّن (PEG)'}],['PPI',{en:'Acid medicine (PPI)',ar:'دواء حموضة (PPI)'}],['Iron',{en:'Iron',ar:'حديد'}],['Vitamin D',{en:'Vitamin D',ar:'فيتامين د'}],['Probiotic',{en:'Probiotic',ar:'بروبيوتيك'}],['Biologic',{en:'Biologic (IBD)',ar:'بيولوجي (IBD)'}],['Antihistamine',{en:'Antihistamine',ar:'مضاد هيستامين'}]];
  return chipsRow('md_pick',meds.map(([v,l])=>({v,label:L(l)}))).replace('data-chips="md_pick"','data-chips="md_pick"');}
function addLog(o){o.id=rid();o.t=nowISO();o.childId=activeChild().id;S.logs.push(o);save();}
function afterSave(){closeSheet();toast(t('saved'));render();}
function saveStool(){const inf=isInfant(activeChild());const o={type:'stool',infant:inf,
  blood:grpVal('st_blood'),mucus:grpVal('st_mucus'),pain:grpVal('st_pain'),note:val('st_note')};
  if(inf){o.consist=grpVal('st_c');o.color=grpVal('st_col');}else{o.bristol=grpVal('st_b');}
  addLog(o);afterSave();}
function saveFeed(){addLog({type:'feed',feed:grpVal('fd_t'),amt:val('fd_amt'),foods:chipVals('fd_foods'),
  allergen:document.getElementById('fd_allerg').checked?val('fd_allergName'):'',note:val('fd_note')});afterSave();}
function saveSym(){addLog({type:'sym',syms:chipVals('sy_t'),pain:scaleVal('sy_pain'),note:val('sy_note')});afterSave();}
function saveVomit(){const col=grpVal('vo_c');addLog({type:'vomit',color:col,force:grpVal('vo_f'),note:val('vo_note')});
  closeSheet();if(col==='green'||col==='bloody'){setTimeout(()=>alert(t('urgentFlag')),50);}toast(t('saved'));render();}
function saveMed(){const name=(chipVals('md_pick')[0]||'')||val('md_name');if(!name){toast(t('pickNum'));return;}
  const dose=val('md_dose'),status=grpVal('md_s')||'taken';
  addLog({type:'med',name,dose,status});
  if(document.getElementById('md_keep').checked&&!S.meds.find(m=>m.childId===activeChild().id&&m.name===name)){S.meds.push({id:rid(),childId:activeChild().id,name,dose});}
  save();afterSave();}
function saveGrowth(){const w=val('gr_w'),h=val('gr_h'),hc=val('gr_hc');if(!w&&!h&&!hc){toast(t('pickNum'));return;}
  addLog({type:'growth',w,h,hc});afterSave();}
function quickMedTaken(mid){const m=S.meds.find(x=>x.id===mid);if(!m)return;addLog({type:'med',name:m.name,dose:m.dose,status:'taken'});toast(t('saved'));}
function val(id){const e=document.getElementById(id);return e?(e.value||'').trim():'';}
function logMeta(l){const inf=l.infant;
  if(l.type==='stool'){const desc=inf?[l.consist,l.color].filter(Boolean).join(' · '):(l.bristol?`${isAr()?'نوع':'Type'} ${l.bristol}`:'');
    const flag=(l.blood==='yes'||l.color==='red'||l.color==='black'||l.color==='pale');
    return{title:`💩 ${isAr()?'براز':'Stool'}`,sub:desc+(l.blood==='yes'?` · ${isAr()?'دم':'blood'}`:''),color:flag?'var(--danger)':'var(--leaf)'};}
  if(l.type==='feed')return{title:`🍼 ${L({en:{breast:'Breastfed',formula:'Formula',solids:'Solids',drink:'Drink'}[l.feed]||'Feed',ar:{breast:'رضاعة',formula:'حليب صناعي',solids:'طعام صلب',drink:'شراب'}[l.feed]||'رضعة'})}`,sub:(l.amt||'')+(l.allergen?` · ⚠︎ ${l.allergen}`:''),color:'var(--sky)'};
  if(l.type==='sym'){const names={pain:{en:'pain',ar:'ألم'},bloat:{en:'bloating',ar:'انتفاخ'},nausea:{en:'nausea',ar:'غثيان'},reflux:{en:'reflux',ar:'ارتجاع'},appetite:{en:'low appetite',ar:'قلة شهية'},gas:{en:'gas',ar:'غازات'},swallow:{en:'swallowing',ar:'بلع'},fatigue:{en:'tired',ar:'إرهاق'}};
    return{title:`🩹 ${isAr()?'أعراض':'Symptom'}`,sub:(l.syms||[]).map(s=>L(names[s])).join('، ')+(l.pain!=null?` · ${isAr()?'ألم':'pain'} ${l.pain}/10`:''),color:'var(--warn)'};}
  if(l.type==='vomit'){const flag=(l.color==='green'||l.color==='bloody');return{title:`🤢 ${isAr()?'قيء':'Vomit'}`,sub:L({en:{clear:'clear',yellow:'yellow',green:'green (bilious)',bloody:'bloody'}[l.color]||'',ar:{clear:'صافٍ',yellow:'أصفر',green:'أخضر',bloody:'دموي'}[l.color]||''}),color:flag?'var(--danger)':'var(--warn)'};}
  if(l.type==='med')return{title:`💊 ${l.name}`,sub:(l.dose||'')+' · '+(l.status==='missed'?t('missed'):t('taken')),color:l.status==='missed'?'var(--warn)':'var(--good)'};
  if(l.type==='growth')return{title:`📏 ${isAr()?'النمو':'Growth'}`,sub:[l.w?`${l.w}kg`:'',l.h?`${l.h}cm`:'',l.hc?`HC ${l.hc}`:''].filter(Boolean).join(' · '),color:'var(--disk)'};
  if(l.type==='water')return{title:`💧 ${isAr()?'شراب':'Drink'}`,sub:`${l.ml} ${isAr()?'مل':'mL'}`,color:'var(--sky)'};
  if(l.type==='supp')return{title:`🧴 ${l.name}`,sub:isAr()?'أُخذ':'taken',color:'var(--good)'};
  if(l.type==='sleep')return{title:`😴 ${isAr()?'نوم':'Sleep'}`,sub:`${l.mins} ${isAr()?'دقيقة':'min'}`,color:'var(--disk)'};
  if(l.type==='nurse')return{title:`🤱 ${isAr()?'رضاعة':'Nursing'}`,sub:[{L:isAr()?'يسار':'Left',R:isAr()?'يمين':'Right',both:isAr()?'كلاهما':'Both'}[l.side]||'',l.mins?l.mins+(isAr()?' د':'m'):''].filter(Boolean).join(' · '),color:'var(--sky)'};
  if(l.type==='pump')return{title:`🍼 ${isAr()?'شفط':'Pumping'}`,sub:`${l.ml} ${isAr()?'مل':'mL'}`,color:'var(--sky)'};
  if(l.type==='teeth')return{title:`🦷 ${isAr()?'تسنين':'Teething'}`,sub:(l.signs||[]).length+(isAr()?' علامات':' signs'),color:'var(--warn)'};
  return{title:l.type,sub:'',color:'var(--muted)'};}

   (grow.length?card(`<b>${t('growthLog')}</b>`+grow.slice().reverse().map(l=>`<div class="list-i"><span class="sm" style="flex:1">${new Date(l.t).toLocaleDateString()}</span><span class="sm">${[l.w?`${l.w}kg`:'',l.h?`${l.h}cm`:'',l.hc?`${l.hc}cm HC`:''].filter(Boolean).join(' · ')}</span></div>`).join('')):'')+

function stat(v,l){return `<div class="card" style="margin:0;text-align:center;padding:12px"><div style="font-size:26px;font-weight:800;color:var(--accent)">${v}</div><div class="xs muted">${l}</div></div>`;}
function miniBar(label,v,total,col){const pct=total?Math.round(v/total*100):0;return `<div style="margin-top:8px"><div class="row between xs"><span>${label}</span><span class="muted">${v} · ${pct}%</span></div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div></div>`;}
function symBreakdown(syms){const names={pain:{en:'Tummy pain',ar:'ألم بطن'},bloat:{en:'Bloating',ar:'انتفاخ'},nausea:{en:'Nausea',ar:'غثيان'},reflux:{en:'Reflux',ar:'ارتجاع'},appetite:{en:'Low appetite',ar:'قلة شهية'},gas:{en:'Gas',ar:'غازات'},swallow:{en:'Swallowing',ar:'بلع'},fatigue:{en:'Tired',ar:'إرهاق'}};
  const cnt={};syms.forEach(l=>(l.syms||[]).forEach(s=>cnt[s]=(cnt[s]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);if(!top.length)return '';
  const max=top[0][1];return `<div style="margin-top:8px">`+top.map(([k,v])=>miniBar(L(names[k]||{en:k,ar:k}),v,max,'var(--warn)')).join('')+`</div>`;}
function copyReport(days){const c=activeChild();const since=Date.now()-days*864e5;const ls=childLogs(c.id).filter(l=>new Date(l.t)>=since);
  let txt=`Baraʿem — ${c.name||'child'} (${ageLabel(c)}) · last ${days} days\n`;
  txt+=`Stool logs: ${ls.filter(l=>l.type==='stool').length}, Symptom days: ${new Set(ls.filter(l=>l.type==='sym').map(l=>l.t.slice(0,10))).size}, Vomit: ${ls.filter(l=>l.type==='vomit').length}, Medicine logs: ${ls.filter(l=>l.type==='med').length}\n`;
  const g=ls.filter(l=>l.type==='growth');if(g.length){const last=g[g.length-1];txt+=`Latest growth: ${[last.w?last.w+'kg':'',last.h?last.h+'cm':''].filter(Boolean).join(', ')}\n`;}
  txt+=`(Educational summary to share with the care team — not a medical assessment.)`;
  navigator.clipboard&&navigator.clipboard.writeText(txt);toast(t('copied'));}

/* measure map: wt→wfa/wfa, ht→lhfa/hfa, hc→hcfa/(none), bmi→bfa/bfa */
const MEAS={wt:{u5:'wfa',o5:'wfa',unit:'kg',name:{en:'Weight',ar:'الوزن'}},ht:{u5:'lhfa',o5:'hfa',unit:'cm',name:{en:'Height/Length',ar:'الطول'}},hc:{u5:'hcfa',o5:null,unit:'cm',name:{en:'Head circ.',ar:'محيط الرأس'}},bmi:{u5:'bfa',o5:'bfa',unit:'',name:{en:'BMI',ar:'كتلة الجسم'}}};
function lmsAt(meas,sex,months){const m=MEAS[meas];let arr,x;
  if(months<=60){arr=WHO_U5_LMS[m.u5]&&WHO_U5_LMS[m.u5][sex];x=months;}
  else{if(!m.o5)return null;arr=WHO_2007_LMS[m.o5]&&WHO_2007_LMS[m.o5][sex];x=months/12;if(meas==='wt'&&x>10)return null;}
  if(!arr)return null;
  if(x<=arr[0].a)return arr[0];if(x>=arr[arr.length-1].a)return arr[arr.length-1];
  for(let i=0;i<arr.length-1;i++){if(x>=arr[i].a&&x<=arr[i+1].a){const f=(x-arr[i].a)/(arr[i+1].a-arr[i].a);
    return{L:arr[i].L+f*(arr[i+1].L-arr[i].L),M:arr[i].M+f*(arr[i+1].M-arr[i].M),S:arr[i].S+f*(arr[i+1].S-arr[i].S)};}}
  return arr[arr.length-1];}
function zScore(x,p){return p.L!==0?((Math.pow(x/p.M,p.L)-1)/(p.L*p.S)):Math.log(x/p.M)/p.S;}
function valAtZ(z,p){return p.L!==0?p.M*Math.pow(1+p.L*p.S*z,1/p.L):p.M*Math.exp(p.S*z);}
function normCdf(z){const b1=.319381530,b2=-.356563782,b3=1.781477937,b4=-1.821255978,b5=1.330274429,pp=.2316419;
  const s=z<0?-1:1;z=Math.abs(z)/Math.SQRT2;const tt=1/(1+pp*z);
  const e=1-(1/Math.sqrt(2*Math.PI))*Math.exp(-z*z/2)*2*(b1*tt+b2*tt*tt+b3*tt**3+b4*tt**4+b5*tt**5);
  return .5*(1+s*Math.sqrt(1-Math.exp(-z*z)));} /* fallback below uses erf approx */
function pct(z){/* standard normal cdf via erf approximation */
  const t=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);
  let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  p=z>0?1-p:p;return Math.round(p*1000)/10;}
function ageMonthsAt(birth,when){const b=new Date(birth+'-01');const w=new Date(when);
  return (w.getFullYear()-b.getFullYear())*12+(w.getMonth()-b.getMonth())+(w.getDate()-b.getDate())/30.4375;}

function growthSVG(c,meas,pts){
  const nowMo=ageMonths(c)||0;const sex=c.sex==='m'?'m':'f';
  let xMin,xMax;if(nowMo<=24){xMin=0;xMax=24;}else if(nowMo<=60){xMin=0;xMax=60;}else{xMin=60;xMax=Math.min(228,Math.max(84,Math.ceil((nowMo+6)/12)*12));}
  if(meas==='hc'){xMin=0;xMax=Math.min(60,Math.max(24,Math.ceil(nowMo)));}
  if(meas==='wt'&&xMax>120)xMax=120;
  const W=460,H=300,pl=38,pr=12,pt=12,pb=26;const iw=W-pl-pr,ih=H-pt-pb;
  const zs=[{z:-1.881,c:'#C9B79E'},{z:-1.036,c:'#B7D0BE'},{z:0,c:'var(--accent)'},{z:1.036,c:'#B7D0BE'},{z:-0,c:''}];
  const bands=[-1.881,-1.036,0,1.036,1.881];
  const steps=36;let curves=[];let yMin=1e9,yMax=-1e9;
  for(const z of bands){const pts2=[];for(let i=0;i<=steps;i++){const mo=xMin+(xMax-xMin)*i/steps;const p=lmsAt(meas,sex,mo);if(!p)continue;const v=valAtZ(z,p);pts2.push([mo,v]);yMin=Math.min(yMin,v);yMax=Math.max(yMax,v);}curves.push(pts2);}
  pts.forEach(p=>{if(p.mo>=xMin-1&&p.mo<=xMax+1){yMin=Math.min(yMin,p[meas]);yMax=Math.max(yMax,p[meas]);}});
  const yPad=(yMax-yMin)*0.08||1;yMin-=yPad;yMax+=yPad;
  const X=mo=>pl+iw*(mo-xMin)/(xMax-xMin);const Y=v=>pt+ih*(1-(v-yMin)/(yMax-yMin));
  const bc=['#C9B79E','#8FBf9f','var(--accent)','#8FBf9f','#C9B79E'];const bl=['3','15','50','85','97'];
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:8px" font-family="inherit">`;
  // y gridlines
  for(let g=0;g<=4;g++){const v=yMin+(yMax-yMin)*g/4;const y=Y(v);svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v.toFixed(v<20?1:0)}</text>`;}
  // x ticks
  const xt=xMax<=24?[0,6,12,18,24]:xMax<=60?[0,12,24,36,48,60]:[];
  const xticks=xt.length?xt:[];const xr=xMax>60;
  if(xr){for(let y2=Math.ceil(xMin/12);y2<=xMax/12;y2+=(xMax-xMin>72?2:1)){const mo=y2*12;svg+=`<text x="${X(mo)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${y2}${isAr()?'س':'y'}</text>`;}}

  svg+=`</svg>`;return svg;}

function calcFluid(){const w=+val('cf_w');const o=document.getElementById('cf_out');if(!w||w<=0){o.style.display='none';return;}

function waterGoal(c){const lg=childLogs(c.id).filter(l=>l.type==='growth'&&l.w).slice(-1)[0];
  const w=lg?+lg.w:null;let ml;if(w){if(w<=10)ml=100*w;else if(w<=20)ml=1000+50*(w-10);else ml=1500+20*(w-20);}
  else{const m=ageMonths(c)||0;ml=m<12?800:m<36?1300:m<96?1600:2000;}
  return Math.round(ml/50)*50;}
route('hydrate',(n)=>{const c=activeChild();if(!c){n.innerHTML=backbar(t('hydration'))+emptyState();return;}
  const today=childLogs(c.id).filter(l=>l.type==='water'&&l.t.slice(0,10)===dayKey());
  const tot=today.reduce((s,l)=>s+(+l.ml||0),0);const goal=waterGoal(c);const pct=Math.min(100,Math.round(tot/goal*100));
  const R=52,C=2*Math.PI*R,off=C*(1-pct/100);
  n.innerHTML=backbar(t('hydration'))+childBar(c)+
   card(`<div style="text-align:center"><svg viewBox="0 0 130 130" width="150" height="150"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--sky)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/><text x="65" y="60" text-anchor="middle" font-size="26" font-weight="800" fill="var(--txt)">${tot}</text><text x="65" y="82" text-anchor="middle" font-size="12" fill="var(--muted)">/ ${goal} ${isAr()?'مل':'mL'}</text></svg>
     <div class="muted sm">${isAr()?'هدف تقريبي حسب العمر/الوزن — يزيد مع الحرارة والنشاط':'Approx goal by age/weight — more with heat and activity'}</div></div>`)+
   card(`<h3 style="margin-bottom:10px">${t('addWater')}</h3><div class="grid2">`+[[120,'🥛'],[200,'🥤'],[250,'🍶'],[60,'🧃']].map(([ml,e])=>`<button class="btn btn-soft" onclick="addWater(${ml})">${e} ${ml} ${isAr()?'مل':'mL'}</button>`).join('')+`</div><div class="row" style="gap:8px;margin-top:10px"><input id="wt_c" type="number" inputmode="numeric" placeholder="${isAr()?'مل':'mL'}" style="flex:1"><button class="btn btn-primary" style="width:auto;padding:12px 18px" onclick="addWater(+val('wt_c'))">＋</button></div>`)+
   (today.length?card(`<b>${isAr()?'اليوم':'Today'}</b>`+today.slice().reverse().map(l=>`<div class="list-i"><span>💧 ${l.ml} ${isAr()?'مل':'mL'}</span><span class="muted xs" style="margin-inline-start:auto">${timeAgo(l.t)}</span></div>`).join('')):'')+
   `<p class="disc">${t('discShort')}</p>`;
});

route('triggers',(n)=>{const c=activeChild();if(!c){n.innerHTML=backbar(t('triggers'))+emptyState();return;}
  const ls=childLogs(c.id);const symDays=new Set(ls.filter(l=>l.type==='sym'||(l.type==='stool'&&(l.pain==='yes'||l.blood==='yes'))||l.type==='vomit').map(l=>l.t.slice(0,10)));
  const feedByDay={};ls.filter(l=>l.type==='feed'&&l.foods&&l.foods.length).forEach(l=>{const d=l.t.slice(0,10);feedByDay[d]=feedByDay[d]||new Set();l.foods.forEach(f=>feedByDay[d].add(f));});
  const foodDays={};Object.entries(feedByDay).forEach(([d,set])=>set.forEach(f=>{foodDays[f]=foodDays[f]||[];foodDays[f].push(d);}));

function copyShare(l){if(navigator.clipboard)navigator.clipboard.writeText(l);toast(t('copied'));}
function loadQR(link){const box=document.getElementById('qrbox');if(!box)return;
  const draw=()=>{try{box.innerHTML='';new QRCode(box,{text:link,width:168,height:168,colorDark:'#2B2019',colorLight:'#ffffff'});}catch(e){box.innerHTML='<div class="muted sm">'+(isAr()?'الرمز يحتاج اتصالًا — انسخ الرابط بدلًا منه.':'QR needs a connection — copy the link instead.')+'</div>';}};
  if(window.QRCode){draw();return;}
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload=draw;s.onerror=()=>{box.innerHTML='<div class="muted sm">'+(isAr()?'الرمز يحتاج اتصالًا — انسخ الرابط.':'QR needs a connection — copy the link.')+'</div>';};document.head.appendChild(s);}
function openShareView(enc){location.hash='r='+enc;renderSharedView();}
function exportAll(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='baraem-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast(isAr()?'تم التصدير':'Exported');}
function importAll(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.children){throw 0;}if(confirm(isAr()?'استبدال بيانات هذا الجهاز بالملف المستورد؟':'Replace this device’s data with the imported file?')){S=Object.assign(blank(),d);S.prefs=Object.assign(blank().prefs,d.prefs||{});save();location.hash='';render();toast(isAr()?'تم الاستيراد ✓':'Imported ✓');}}catch(e){toast(isAr()?'ملف غير صالح':'Invalid file');}};r.readAsText(f);}

/* read-only shared viewer (opened from #r= link) */
function renderSharedView(){const host=document.getElementById('screens');document.getElementById('tabbar').classList.add('hidden');document.getElementById('fab').classList.add('hidden');
  let d;try{d=b64dec(location.hash.slice(3));}catch(e){render();return;}applyDir();
  host.innerHTML=`<div class="screen">${card(`<div style="text-align:center;margin-bottom:10px"><div style="width:40px;height:40px;margin:0 auto">${brandSVG().replace('width="30" height="30"','width="40" height="40"')}</div><b>Baraʿem · براعم</b><div class="muted xs">${isAr()?'ملخّص للقراءة فقط':'Read-only summary'} · ${d.d||''}</div></div>
     <table style="width:100%;font-size:14px"><tr><td class="muted" style="width:42%;padding:4px 0">${isAr()?'الطفل':'Child'}</td><td><b>${d.n||'—'}</b> · ${d.a||''}</td></tr>
     <tr><td class="muted" style="padding:4px 0">${isAr()?'الحالات':'Conditions'}</td><td>${(d.cd||[]).join('، ')||'—'}</td></tr>
     ${d.g?`<tr><td class="muted" style="padding:4px 0">${isAr()?'آخر نمو':'Latest growth'}</td><td>${[d.g.w?d.g.w+'kg':'',d.g.h?d.g.h+'cm':'',d.g.p!=null?`${d.g.p}${isAr()?' مئين':'th pct'}`:''].filter(Boolean).join(' · ')}</td></tr>`:''}
     <tr><td class="muted" style="padding:4px 0">${isAr()?'آخر ١٤ يومًا':'Last 14 days'}</td><td>${d.st||0} ${isAr()?'إدخالات براز':'stool logs'} · ${d.sy||0} ${isAr()?'أيام بأعراض':'symptom days'}</td></tr>
     <tr><td class="muted" style="padding:4px 0">${isAr()?'الأدوية':'Medicines'}</td><td>${(d.md||[]).join('، ')||'—'}</td></tr></table>
     <div class="alert warn" style="margin-top:12px"><span class="sm">${t('shareTeam')}</span></div>`)}
     <button class="btn btn-primary" onclick="location.hash='';render()">${isAr()?'فتح براعم':'Open Baraʿem'}</button></div>`;}

/* ============ WASHROOM FINDER ============ */
route('washroom',(n)=>{
  S.places=S.places||[];
  const q=(term)=>{const g=S.geo;const base='https://www.google.com/maps/search/';
    return base+encodeURIComponent(term)+(g?`/@${g.lat},${g.lng},15z`:'');};
  const finds=[
   {em:'🚻',term:'public restroom',t:{en:'Public restroom',ar:'دورة مياه عامة'}},
   {em:'🕌',term:'mosque',t:{en:'Mosque (has washrooms)',ar:'مسجد (به دورات مياه)'}},
   {em:'🏬',term:'shopping mall',t:{en:'Mall',ar:'مركز تسوّق'}},
   {em:'⛽',term:'gas station',t:{en:'Petrol station',ar:'محطة وقود'}},
   {em:'☕',term:'cafe',t:{en:'Café',ar:'مقهى'}}
  ];
  n.innerHTML=backbar(t('washroom'))+
   card(`<p class="sm muted">${isAr()?'ابحث عن أقرب دورة مياه عند الخروج مع طفل يعاني من إلحاح أو إمساك أو التهاب الأمعاء. يفتح الخرائط في متصفّحك.':'Find the nearest bathroom when you’re out with a child who has urgency, constipation or IBD. Opens maps in your browser.'}</p>
     <button class="btn btn-soft" style="margin-top:10px" onclick="getGeo()">📍 ${S.geo?(isAr()?'تم تحديد موقعك ✓':'Location set ✓'):(isAr()?'استخدم موقعي (اختياري)':'Use my location (optional)')}</button>`)+
   card(`<h3 style="margin-bottom:10px">${t('findNear')}</h3>`+finds.map(f=>`<a class="opt" href="${q(f.term)}" target="_blank" rel="noopener"><span class="em">${f.em}</span><span style="flex:1">${L(f.t)}</span><span class="muted">↗</span></a>`).join(''))+
   card(`<div class="row between" style="margin-bottom:8px"><b>${t('savedPlaces')}</b></div><div class="row" style="gap:8px"><input id="pl_n" placeholder="${isAr()?'مثال: دورة مياه المول القريب':'e.g. mall bathroom nearby'}" style="flex:1"><button class="btn btn-primary" style="width:auto;padding:12px 16px" onclick="addPlace()">＋</button></div>`+
     (S.places.length?`<div style="margin-top:10px">`+S.places.map((p,i)=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>📍 ${p}</span><button class="chip" onclick="rmPlace(${i})">✕</button></div>`).join('')+`</div>`:''))+
   `<p class="disc">${isAr()?'يستخدم خرائط الطرف الثالث. لا يُرسَل موقعك إلى برعم.':'Uses third-party maps. Your location is not sent to Baraʿem.'}</p>`;
});
function getGeo(){if(!navigator.geolocation){toast(isAr()?'غير متاح':'Not available');return;}
  navigator.geolocation.getCurrentPosition(p=>{S.geo={lat:p.coords.latitude.toFixed(5),lng:p.coords.longitude.toFixed(5)};save();toast(isAr()?'تم ✓':'Done ✓');render();},()=>toast(isAr()?'تعذّر تحديد الموقع':'Location unavailable'));}
function addPlace(){const v=val('pl_n');if(!v)return;S.places=S.places||[];S.places.push(v);save();render();}
function rmPlace(i){S.places.splice(i,1);save();render();}

/* ============ THEME GALLERY ============ */
route('themes',(n)=>{
  const cur=S.prefs.accent?null:(S.prefs.themeKey||'apricot');
  n.innerHTML=backbar(t('themesT'))+
   card(`<div class="row between"><span>${t('theme')}</span><button class="chip ${S.prefs.theme==='dark'?'on':''}" onclick="toggleTheme()">${S.prefs.theme==='dark'?'🌙 '+(isAr()?'داكن':'Dark'):'☀️ '+(isAr()?'فاتح':'Light')}</button></div>`)+
   card(`<h3 style="margin-bottom:12px">${isAr()?'لون التطبيق':'App colour'}</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">`+
     THEMES.map(th=>`<button onclick="setTheme('${th.k}')" style="border:2px solid ${cur===th.k?'var(--txt)':'transparent'};background:none;border-radius:14px;padding:6px;cursor:pointer;text-align:center"><div style="width:100%;aspect-ratio:1;border-radius:11px;background:linear-gradient(140deg,${th.a},${th.s})"></div><div class="xs" style="margin-top:5px">${L(th.name)}</div></button>`).join('')+`</div>`)+
   card(`<div class="row between" style="margin-bottom:10px"><span>${t('customColor')}</span><input type="color" value="${S.prefs.accent||'#EA8A4E'}" onchange="setCustom(this.value)" style="width:52px;height:38px;padding:2px;border-radius:10px"></div><button class="btn btn-soft" onclick="surpriseTheme()">🎲 ${t('surprise')}</button>`)+
   card(`<div class="between row"><span>${t('textSize')}</span><div class="row"><button class="chip" onclick="setText(-1)">A−</button><button class="chip" onclick="setText(1)">A+</button></div></div>`)+
   `<p class="disc">${t('discShort')}</p>`;
});
function setTheme(k){S.prefs.themeKey=k;S.prefs.accent=null;save();render();}
function setCustom(hex){S.prefs.accent=hex;save();render();}
function surpriseTheme(){const th=THEMES[Math.floor(Math.random()*THEMES.length)];S.prefs.themeKey=th.k;S.prefs.accent=null;if(Math.random()<0.4)S.prefs.theme=S.prefs.theme==='dark'?'light':'dark';save();render();}

/* ============ AUTO-UPDATE PROMPT ============ */
function showUpdateBanner(reg){if(document.getElementById('updbn'))return;
  const b=document.createElement('div');b.id='updbn';
  b.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:400;background:var(--accent);color:#fff;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;max-width:92vw';
  b.innerHTML=`<span>✨ ${t('updateReady')}</span><button style="background:#fff;color:var(--accent-strong);border:0;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer">${t('refresh')}</button>`;
  b.querySelector('button').onclick=()=>{if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});setTimeout(()=>location.reload(),300);};
  document.body.appendChild(b);}

/*__SPLIT__*/

/* ============ BOOT ============ */
if(location.hash.indexOf('#r=')===0){try{renderSharedView();}catch(e){render();}}else{render();}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner(reg);});});
  }).catch(()=>{});
  let refreshed=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshed)return;refreshed=true;location.reload();});
}
</script>
</body>
</html>
